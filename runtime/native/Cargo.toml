[package]
name = "agent-rat-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "LicenseRef-Reticulum-License"
publish = false

[workspace]

[dependencies]
rns-runtime = { path = "../../../rsReticulum/crates/rns-runtime" }
