# Builds the Pi runtime and Ratspeak Agent for macOS, Linux, and Windows.
# Runs when started by hand or when a version tag (v*) is pushed.
#
# Tag pushes sign and notarize the macOS DMG using the same Apple Developer ID
# secrets/vars as Ratspeak (APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
# APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID) and assemble
# a release bundle with SHA256SUMS. A configured updater key signs
# the packages and allows CI to create the draft GitHub Release.
name: release
on:
  workflow_dispatch:
    inputs:
      notarize:
        description: Notarize macOS and sign updater packages
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  SIGN_UPDATES: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.notarize == true }}
  TAURI_CLI: '@tauri-apps/cli@2.12.4'

jobs:
  pi:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Sources the transport is pinned to
        run: |
          git clone --quiet https://github.com/ratspeak/rsReticulum ../rsReticulum
          git clone --quiet https://github.com/ratspeak/rsLXMF ../rsLXMF
          git clone --quiet https://github.com/ratspeak/rsLXST ../rsLXST
      - run: python3 scripts/check-upstream-pins.py
      - run: python3 -m compileall -q ratspeak_pi runtime
      - run: scripts/build-native.sh
      - run: scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pi-release
          path: build/dist/ratspeak-pi-*-aarch64.tar.gz*

  desktop-helper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Sources the transport is pinned to
        run: |
          git clone --quiet https://github.com/ratspeak/rsReticulum ../rsReticulum
          git clone --quiet https://github.com/ratspeak/rsLXMF ../rsLXMF
          git clone --quiet https://github.com/ratspeak/rsLXST ../rsLXST
      - run: scripts/build-desktop-helper.sh
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-helper
          path: build/dist/desktop-native-amd64.gz

  app:
    needs: [pi, desktop-helper]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MACOS_SIGN: ${{ matrix.os == 'macos-latest' && (startsWith(github.ref, 'refs/tags/v') || inputs.notarize == true) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pi-release
          path: build/dist
      - uses: actions/download-artifact@v4
        with:
          name: desktop-helper
          path: build/dist
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf libfuse2 xvfb xauth xdotool
      - run: cargo test --release --locked
        working-directory: app/src-tauri

      - name: Import Apple Developer ID certificate
        if: env.MACOS_SIGN == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required macOS signing/notarization value: $name" >&2
              exit 1
            fi
          done
          # Pasted secrets can carry a trailing newline, which breaks the p12 passphrase.
          APPLE_CERTIFICATE_PASSWORD="$(printf '%s' "$APPLE_CERTIFICATE_PASSWORD" | tr -d '\r\n')"
          APPLE_ID="$(printf '%s' "$APPLE_ID" | tr -d '\r\n')"
          APPLE_PASSWORD="$(printf '%s' "$APPLE_PASSWORD" | tr -d '\r\n')"
          APPLE_TEAM_ID="$(printf '%s' "$APPLE_TEAM_ID" | tr -d '\r\n')"

          certificate_path="$RUNNER_TEMP/developer_id_application.p12"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "RATSPEAK_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"
          xcrun notarytool history --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" >/dev/null

      - name: Build signed macOS DMG
        if: env.MACOS_SIGN == 'true'
        shell: bash
        working-directory: app/src-tauri
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: |
          set -euo pipefail
          # Let Tauri sign the app and outer DMG; notarization runs explicitly below.
          unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_PATH
          npx --yes "$TAURI_CLI" build --bundles app,dmg -- --locked

      - name: Build installer
        if: env.MACOS_SIGN != 'true'
        shell: bash
        working-directory: app/src-tauri
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: npx --yes "$TAURI_CLI" build -- --locked

      - name: Notarize and verify macOS DMG
        if: env.MACOS_SIGN == 'true'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          APPLE_ID="$(printf '%s' "$APPLE_ID" | tr -d '\r\n')"
          APPLE_PASSWORD="$(printf '%s' "$APPLE_PASSWORD" | tr -d '\r\n')"
          APPLE_TEAM_ID="$(printf '%s' "$APPLE_TEAM_ID" | tr -d '\r\n')"
          dmgs=(app/src-tauri/target/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "Expected 1 macOS DMG, found ${#dmgs[@]}" >&2
            exit 1
          fi
          dmg="${dmgs[0]}"
          hdiutil verify "$dmg"
          codesign --verify --strict --verbose=2 "$dmg"
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --timeout 30m \
            --output-format json > "$RUNNER_TEMP/notary.json" || true
          cat "$RUNNER_TEMP/notary.json"
          status="$(plutil -extract status raw -o - "$RUNNER_TEMP/notary.json" 2>/dev/null || true)"
          if [ "$status" != "Accepted" ]; then
            sub_id="$(plutil -extract id raw -o - "$RUNNER_TEMP/notary.json" 2>/dev/null || true)"
            if [ -n "$sub_id" ]; then
              xcrun notarytool log "$sub_id" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" >&2 || true
            fi
            echo "Apple notarization did not accept $dmg (status: ${status:-unknown})" >&2
            exit 1
          fi
          xcrun stapler staple "$dmg"
          xcrun stapler validate -v "$dmg"
          spctl -a -vv -t open --context context:primary-signature "$dmg"

          app_dir=app/src-tauri/target/release/bundle/macos
          apps=("$app_dir"/*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "Expected 1 macOS app, found ${#apps[@]}" >&2
            exit 1
          fi
          app="${apps[0]}"
          xcrun stapler staple "$app"
          xcrun stapler validate -v "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          COPYFILE_DISABLE=1 tar -C "$app_dir" -czf "$app.tar.gz" "${app##*/}"

      - name: Remove temporary signing keychain
        if: always() && env.RATSPEAK_SIGNING_KEYCHAIN != ''
        shell: bash
        run: security delete-keychain "$RATSPEAK_SIGNING_KEYCHAIN" || true

      - if: runner.os == 'Linux'
        run: scripts/deb-version.sh app/src-tauri/target/release/bundle/deb/*.deb

      - name: Smoke test the AppImage
        if: runner.os == 'Linux'
        run: bash scripts/check-appimage.sh app/src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Sign updater packages
        if: env.SIGN_UPDATES == 'true'
        shell: bash
        working-directory: app/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Updater signing will be done by the release maintainer."
            exit 0
          fi
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml)
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi
          shopt -s nullglob
          bundle=target/release/bundle
          case "$RUNNER_OS" in
            macOS) packages=("$bundle"/macos/*.app.tar.gz); expected=1 ;;
            Windows) packages=("$bundle"/nsis/*.exe); expected=1 ;;
            Linux) packages=("$bundle"/deb/*.deb "$bundle"/rpm/*.rpm "$bundle"/appimage/*.AppImage); expected=3 ;;
          esac
          if [ "${#packages[@]}" -ne "$expected" ]; then
            echo "Expected $expected updater packages, found ${#packages[@]}" >&2
            exit 1
          fi
          for package in "${packages[@]}"; do
            npx --yes "$TAURI_CLI" signer sign --app-version "$version" "$package"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ratspeak-agent-${{ runner.os }}
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/rpm/*.rpm
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/macos/*.app.tar.gz
            app/src-tauri/target/release/bundle/*/*.sig

  publish:
    needs: [pi, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble release files and SHA256SUMS
        id: assemble
        run: |
          set -euo pipefail
          python3 scripts/assemble-release.py
          cat release/SHA256SUMS
          if [ -f release/latest.json ]; then echo 'signed=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: release/*
      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.assemble.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          cat > release-notes.md <<EOF
          Ratspeak Agent is a private AI assistant you message over Ratspeak, hosted on your own computer or a Raspberry Pi.

          - **macOS:** Signed with Ratspeak LLC Developer ID and notarized by Apple.
          - **Windows:** Windows may show a SmartScreen prompt. Verify downloads against \`SHA256SUMS\`.
          - **Linux x86-64:** AppImage, DEB, and RPM downloads are available.
          - **Raspberry Pi direct install:** \`ratspeak-pi-*-aarch64.tar.gz\` for 64-bit Raspberry Pi OS (Debian 13 Trixie or later).
          - **App updates:** Select **Check for updates**, then **Update now** to install a verified update and reopen the app.
          EOF
          gh release create "$TAG" release/* \
            --draft --verify-tag --repo "$GITHUB_REPOSITORY" \
            "${prerelease[@]}" \
            --title "$TAG" \
            --notes-file release-notes.md
