[package]
name = "ratspeak-agent"
version = "0.1.2"
authors = ["Ratspeak LLC"]
license-file = "../../LICENSE"
edition = "2021"
publish = false
repository = "https://github.com/ratspeak/ratspeak-agent"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
semver = "1"
tempfile = "3"
rns-identity = { git = "https://github.com/ratspeak/rsReticulum", rev = "5e35c9f9d9f40d44846aaa5e11009e03490511d3" }
rns-interface = { git = "https://github.com/ratspeak/rsReticulum", rev = "5e35c9f9d9f40d44846aaa5e11009e03490511d3" }
rns-transport = { git = "https://github.com/ratspeak/rsReticulum", rev = "5e35c9f9d9f40d44846aaa5e11009e03490511d3" }
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
rand = "0.8"
hex = "0.4"
base64 = "0.23"
sha2 = "0.10"
aes-gcm = "0.10"
xz2 = { version = "0.1.7", features = ["static"] }
fatfs = "0.3"
fscommon = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gdkx11 = "0.18"
gtk = "0.18"
x11 = { version = "2", features = ["xlib"] }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-wlan = "0.3"
objc2-core-location = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_WiFi", "Win32_NetworkManagement_Ndis", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_SystemInformation", "Win32_System_Ioctl", "Win32_System_Threading"] }

[profile.release]
opt-level = 2
strip = true
